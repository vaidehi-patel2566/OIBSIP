<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your account.">
    <title>Login | Auth System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <p class="eyebrow">LEVEL 2 · TASK 4</p>
            <h1>Welcome back</h1>
            <p class="lead">Log in to open your protected dashboard.</p>

            <form id="login-form" novalidate>
                <label for="login-identity">Username or email</label>
                <input id="login-identity" name="identity" type="text" autocomplete="username">

                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password">

                <p id="login-error" class="form-error" role="alert"></p>
                <button type="submit">Login</button>
            </form>

            <p class="switch">New here? <a href="register.html">Create an account</a></p>
        </section>
    </main>
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
