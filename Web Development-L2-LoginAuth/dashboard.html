<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Protected dashboard for signed-in users.">
    <title>Dashboard | Auth System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dash-page">
        <section class="dash-card">
            <p class="eyebrow">PROTECTED PAGE</p>
            <h1>Dashboard</h1>
            <p class="lead">This page is only available after a successful login.</p>

            <div class="profile">
                <p><strong>Name:</strong> <span id="session-username"></span></p>
                <p><strong>Email:</strong> <span id="session-email"></span></p>
            </div>

            <p class="note">If you open this file without a session, you will be sent back to the login page.</p>
            <button id="logout-button" type="button">Logout</button>
        </section>
    </main>
    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
